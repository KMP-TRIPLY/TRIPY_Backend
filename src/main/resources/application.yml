server:
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Triply

  # ===== Database =====
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== Redis =====
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  # ===== OAuth2 =====
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "https://tripy-backend-u9ty.onrender.com/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
            client-authentication-method: client_secret_post

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "https://tripy-backend-u9ty.onrender.com/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - profile_image
            client-name: Naver

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY} # 30분 (ms)
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY} # 14일 (ms)

# ===== App =====
# 프론트엔드 콜백 URL (웹: http://localhost:3000/oauth2/callback, 앱: tripy://auth/callback)
app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:https://triply-six.vercel.app/oauth2/callback}
  seed:
    enabled: ${APP_SEED_ENABLED:false}

# ===== Korea Tourism Open API =====
tourism:
  api:
    key: ${TOURISM_API_KEY}
    base-url: https://apis.data.go.kr/B551011/LocgoHubTarService1
    cache-hours: 24
