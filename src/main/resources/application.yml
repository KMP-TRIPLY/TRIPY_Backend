server:
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Triply

  # ===== 업로드 =====
  # 스프링 기본값은 파일 1MB 라 미션 사진(폰 사진 2~5MB)이 앱에 닿기도 전에 막힌다.
  # 실제 거절 판단은 mission.photo.max-bytes(5MB)가 하도록 그보다 한 칸 높게 잡는다.
  # 여기서 먼저 걸리면 앱의 에러 응답 대신 스프링 예외가 나가 응답 포맷이 깨진다.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 12MB

  # ===== Database =====
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: update
    # 운영에서 켜두면 모든 쿼리가 stdout 으로 나가 기동·응답이 느려진다. 필요할 때만 켠다.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_SHOW_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== Redis =====
  # 소셜 로그인의 인가 요청이 여기 얹혀 있다. 붙지 않으면 로그인이 전부 실패하므로
  # host/port 는 기본값을 두지 않는다. 환경변수를 빠뜨리면 기동 자체가 막혀 바로 드러난다.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      # 관리형 Redis 는 보통 비밀번호와 TLS 를 요구한다. 로컬은 둘 다 없으므로 비워 둔다.
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

  # ===== OAuth2 =====
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "https://tripy-backend-u9ty.onrender.com/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
            client-authentication-method: client_secret_post

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "https://tripy-backend-u9ty.onrender.com/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - profile_image
            client-name: Naver

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY} # 30분 (ms)
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY} # 14일 (ms)

# ===== App =====
# 프론트엔드 콜백 URL (웹: http://localhost:3000/oauth2/callback, 앱: tripy://auth/callback)
app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:https://triply-six.vercel.app/oauth2/callback}
    # 로그인 시작 시 ?redirect_uri= 로 고를 수 있는 콜백 목록 (완전 일치). 위 기본값도 포함해야 한다.
    allowed-redirect-uris: ${APP_OAUTH2_ALLOWED_REDIRECT_URIS:https://triply-six.vercel.app/oauth2/callback,https://triply-qa.onrender.com,https://triply-qa.onrender.com/oauth2/callback}
    # 인가 요청과 초대 문맥을 state 를 열쇠로 Redis 에 보관하는 시간.
    # 콜백에서 한 번 쓰고 지우므로 사용자가 소셜 로그인 화면에 머무는 시간만 버티면 된다.
    authorization-request-ttl-seconds: ${APP_OAUTH2_AUTH_REQUEST_TTL_SECONDS:300}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  withdrawal:
    # 탈퇴 후 이 기간이 지나야 같은 소셜 계정으로 다시 가입할 수 있다.
    # 재가입은 새 계정이며 예전 여행 코스·리워드·기록은 따라오지 않는다.
    rejoin-wait-days: ${APP_WITHDRAWAL_REJOIN_WAIT_DAYS:7}

game:
  room:
    host-delegation-timeout-minutes: ${GAME_ROOM_HOST_DELEGATION_TIMEOUT_MINUTES:5}
    host-delegation-check-delay-ms: ${GAME_ROOM_HOST_DELEGATION_CHECK_DELAY_MS:60000}
    # 방치된 방 정리. 코스가 모두 당일치기라 하루를 넘긴 방은 끝난 것으로 본다.
    # 0 이하로 두면 해당 정리를 끄고, 방은 수동으로 끝날 때까지 남는다.
    waiting-expire-hours: ${GAME_ROOM_WAITING_EXPIRE_HOURS:6}
    running-expire-hours: ${GAME_ROOM_RUNNING_EXPIRE_HOURS:24}
    cleanup-check-delay-ms: ${GAME_ROOM_CLEANUP_CHECK_DELAY_MS:300000}

# ===== 미션 사진 인증 =====
# 저장소: OCI Object Storage 의 S3 호환 API. 값이 비어 있으면 사진 미션 제출이 503 으로 거부된다.
# (조용히 통과시키면 인증이 없는 것과 같으므로 일부러 막는다)
mission:
  photo:
    max-bytes: ${MISSION_PHOTO_MAX_BYTES:5242880} # 5MB
    storage:
      endpoint: ${OCI_S3_ENDPOINT:}   # https://<namespace>.compat.objectstorage.<region>.oci.customer-oci.com
      region: ${OCI_S3_REGION:ap-chuncheon-1}
      bucket: ${OCI_S3_BUCKET:}
      access-key: ${OCI_S3_ACCESS_KEY:}
      secret-key: ${OCI_S3_SECRET_KEY:}
    verification:
      # false 로 끄면 "업로드 성공 = 통과" 가 되어 아무 사진이나 다 통과한다.
      # 판정 없이 굴려야 하는 상황(데모·수동 QA)에서만 명시적으로 끈다.
      enabled: ${MISSION_PHOTO_AI_ENABLED:true}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${MISSION_PHOTO_AI_MODEL:gpt-5-mini}
      # 이 값 이상이면 통과. 오탐으로 게임이 막히면 재배포 없이 조정할 수 있어야 한다.
      # 통과는 0.8 대, 거부는 0.2 대로 갈리므로 그 사이에 둔다. 낮춰도 거부가 새지 않는다.
      threshold: ${MISSION_PHOTO_AI_THRESHOLD:0.6}

# ===== Korea Tourism Open API =====
tourism:
  api:
    key: ${TOURISM_API_KEY}
    base-url: https://apis.data.go.kr/B551011/LocgoHubTarService1
    kor-service-base-url: https://apis.data.go.kr/B551011/KorService2
    # 데이터랩 통계는 월 단위로 갱신되므로 짧게 캐시해도 신선도 손실이 없다.
    # 공모전 심사가 인증키의 실제 API 호출 이력을 검증하므로 실시간 호출에 가깝게 유지한다 —
    # 늘리기 전에 그 제약을 먼저 확인할 것.
    cache-hours: ${TOURISM_API_CACHE_HOURS:1}
