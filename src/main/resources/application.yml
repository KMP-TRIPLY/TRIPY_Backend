spring:
  application:
    name: Triply

  # ===== Database =====
  datasource:
    url: jdbc:postgresql://localhost:5432/triply
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379

  # ===== OAuth2 =====
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
            client-authentication-method: client_secret_post

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - profile_image
            client-name: Naver

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000       # 30분 (ms)
  refresh-token-expiry: 1209600000   # 14일 (ms)

# ===== App =====
# 프론트엔드 콜백 URL (웹: http://localhost:3000/oauth2/callback, 앱: tripy://auth/callback)
app:
  oauth2:
    redirect-uri: http://localhost:3000/oauth2/callback
  seed:
    enabled: ${APP_SEED_ENABLED:false}

# ===== Korea Tourism Open API =====
tourism:
  api:
    key: ${TOURISM_API_KEY}
    base-url: https://apis.data.go.kr/B551011/LocgoHubTarService1
    cache-hours: 24
