name: Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# 연달아 push 해도 배포는 한 번에 하나만 (jar 교체 도중 겹치면 꼬임)
concurrency:
  group: deploy-oci

permissions:
  contents: read

env:
  # 서버 환경에 맞게 이 두 줄만 수정
  JAR_PATH: /home/ubuntu/app.jar
  SERVICE: triply

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      # @Tag("integration") 붙은 테스트는 build.gradle 에서 CI 일 때 자동 제외됨
      - run: ./gradlew test
      - run: ./gradlew bootJar

      - name: Deploy to OCI
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ secrets.OCI_HOST }}
          SSH_USER: ${{ secrets.OCI_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id build/libs/Triply-*.jar "$SSH_USER@$HOST:$JAR_PATH.new"
          # 60초 안에 8080 이 안 뜨면 이전 jar 로 롤백
          ssh -i ~/.ssh/id "$SSH_USER@$HOST" "
            cp $JAR_PATH $JAR_PATH.bak &&
            mv $JAR_PATH.new $JAR_PATH &&
            sudo systemctl restart $SERVICE &&
            timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:8080/; do sleep 2; done' ||
            { mv $JAR_PATH.bak $JAR_PATH; sudo systemctl restart $SERVICE; echo 'deploy failed, rolled back'; exit 1; }
          "
