name: Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  # 서버 환경에 맞게 이 두 줄만 수정
  JAR_PATH: /home/ubuntu/app.jar
  SERVICE: triply

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      # TriplyApplicationTests 는 local 프로필 + 실제 DB 가 필요해서 CI 에서 제외
      - run: ./gradlew test --tests 'com.kmp.Triply.domain.*'
      - run: ./gradlew bootJar

      - name: Deploy to OCI
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ secrets.OCI_HOST }}
          USER: ${{ secrets.OCI_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id build/libs/Triply-*.jar "$USER@$HOST:$JAR_PATH.new"
          # 실패하면 이전 jar 로 되돌리고 종료 (배포 실패 = 서버 멈춤 방지)
          ssh -i ~/.ssh/id "$USER@$HOST" "
            cp $JAR_PATH $JAR_PATH.bak &&
            mv $JAR_PATH.new $JAR_PATH &&
            sudo systemctl restart $SERVICE &&
            sleep 20 &&
            systemctl is-active --quiet $SERVICE ||
            { mv $JAR_PATH.bak $JAR_PATH; sudo systemctl restart $SERVICE; echo 'deploy failed, rolled back'; exit 1; }
          "
